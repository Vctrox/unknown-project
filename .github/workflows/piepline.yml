name: Python CI/CD Pipeline with MariaDB

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-secure:
    runs-on: ubuntu-latest
    
    # Add MariaDB service
    services:
      mariadb:
        image: mariadb:latest
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: user_management
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev default-libmysqlclient-dev build-essential
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
      
    - name: Configure database connection
      run: |
        echo "DB_USERNAME=root" >> $GITHUB_ENV
        echo "DB_PASSWORD=rootpassword" >> $GITHUB_ENV
        echo "DB_HOST=localhost" >> $GITHUB_ENV
        echo "DB_PORT=3306" >> $GITHUB_ENV
        echo "DB_NAME=user_management" >> $GITHUB_ENV
    
    - name: Run unit tests
      run: |
        pytest tests/
    
    - name: Run static analysis with Bandit
      run: |
        bandit -r app/ -f custom
    
    - name: Check for vulnerable dependencies
      run: |
        safety check
    
    - name: Detect hardcoded secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}