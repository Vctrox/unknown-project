name: Python CI/CD Pipeline with MariaDB

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-secure:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: user_management
          MARIADB_USER: testuser
          MARIADB_PASSWORD: testpassword
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev default-libmysqlclient-dev build-essential mariadb-client
    
    - name: Wait for MariaDB to be ready
      run: |
        max_attempts=10
        attempt=0
        while ! mariadb -h 127.0.0.1 -u root -prootpassword -e "SELECT 1" &> /dev/null; do
          if [ $attempt -ge $max_attempts ]; then
            echo "MariaDB did not become ready in time"
            exit 1
          fi
          echo "Waiting for MariaDB to be ready... (attempt $attempt)"
          sleep 5
          ((attempt++))
        done
    
    - name: Verify MariaDB connection
      run: |
        mariadb -h 127.0.0.1 -u root -prootpassword -e "SHOW DATABASES;"
        mariadb -h 127.0.0.1 -u root -prootpassword user_management -e "SELECT 1;"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Configure database connection
      run: |
        echo "DB_USERNAME=testuser" >> $GITHUB_ENV
        echo "DB_PASSWORD=testpassword" >> $GITHUB_ENV
        echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
        echo "DB_PORT=3306" >> $GITHUB_ENV
        echo "DB_NAME=user_management" >> $GITHUB_ENV
    
    - name: Run unit tests
      run: |
        pytest tests/
    
    - name: Run static analysis with Bandit
      run: |
        bandit -r app/ -f custom
    
    - name: Check for vulnerable dependencies
      run: |
        pip-audit
      continue-on-error: true  # Step-level continue-on-error
    
    - name: Detect hardcoded secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
